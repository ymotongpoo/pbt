<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.GuideTitle}}</title>
<link rel="canonical" href="{{.Canonical}}">
{{if .Analytics}}<script async src="https://www.googletagmanager.com/gtag/js?id={{.Analytics}}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{.Analytics}}');
</script>
{{end}}<style>
:root { --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; --bg: #fff; --code: #f6f8fa; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); background: var(--bg); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.layout { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: 100vh; }
nav.side { border-right: 1px solid var(--line); padding: 1.5rem 1rem; font-size: 0.92rem; }
nav.side h1 { font-size: 1rem; margin: 0 0 0.25rem; }
nav.side .version { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
nav.side ol { list-style: none; padding: 0; margin: 0; }
nav.side li { margin: 0.2rem 0; }
nav.side li.current a { font-weight: 600; color: var(--fg); }
nav.side .lang { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
main { padding: 2rem 3rem 4rem; max-width: 52rem; }
main h1 { font-size: 1.9rem; line-height: 1.25; margin-top: 0; }
main h2 { font-size: 1.35rem; margin-top: 2.2rem; border-bottom: 1px solid var(--line); padding-bottom: 0.2rem; }
main h3 { font-size: 1.1rem; margin-top: 1.6rem; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
p code, li code, td code { background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; }
pre { background: var(--code) !important; padding: 0.9rem 1rem; border-radius: 6px; overflow-x: auto; line-height: 1.5; }
table { border-collapse: collapse; margin: 1rem 0; font-size: 0.92rem; }
th, td { border: 1px solid var(--line); padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
th { background: var(--code); }
blockquote { margin: 1rem 0; padding: 0.2rem 1rem; border-left: 4px solid var(--line); color: var(--muted); }
.pager { display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); gap: 1rem; }
footer { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 1.5rem 1.2rem 3rem; }
}
</style>
</head>
<body>
<div class="layout">
<nav class="side">
<h1><a href="./">{{.GuideTitle}}</a></h1>
<div class="version">pbt {{.Version}}</div>
<ol>
{{range .Nav}}<li{{if .Current}} class="current"{{end}}><a href="{{.Href}}">{{.Title}}</a></li>
{{end}}</ol>
<div class="lang"><a href="{{.OtherLang}}">{{.OtherLabel}}</a></div>
<div class="lang"><a href="https://pkg.go.dev/go.ymotongpoo.com/pbt">pkg.go.dev</a> · <a href="https://github.com/ymotongpoo/pbt">GitHub</a></div>
</nav>
<main>
{{.Content}}
<div class="pager">
<span>{{if .Prev}}← <a href="{{.Prev.Href}}">{{.Prev.Title}}</a>{{end}}</span>
<span>{{if .Next}}<a href="{{.Next.Href}}">{{.Next.Title}}</a> →{{end}}</span>
</div>
<footer>{{.GuideTitle}} for pbt {{.Version}} · <a href="https://github.com/ymotongpoo/pbt/tree/main/docs/guide">source</a> · Apache License 2.0</footer>
</main>
</div>
</body>
</html>
